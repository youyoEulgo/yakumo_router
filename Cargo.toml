[package]
name = "reverse_proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.13.3", features = ["stream"] }
serde_json = "1"
bytes = "1"
futures = "0.3"
dotenvy = "0.15"