[package]
name = "yakumo_router"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yakumo"
path = "src/main.rs"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.13.3", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"
futures = "0.3"
notify = "8"
rust-embed = "8"
regex = "1"
