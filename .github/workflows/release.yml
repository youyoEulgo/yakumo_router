name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # musl builds need a musl C compiler for the aws-lc-rs dependency of rustls.
  CC_x86_64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive: zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ''
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            ext: ''
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            ext: ''
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ui/dist is embedded into the binary at compile time and is git-ignored,
      # so the frontend has to be built before cargo build.
      - name: Build the web UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo "C:/Program Files/NASM" >> "$GITHUB_PATH"

      - name: Build the binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="yakumo-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "package/${name}"
          cp "target/${{ matrix.target }}/release/yakumo${{ matrix.ext }}" "package/${name}/"
          cp README.md README.zh-CN.md LICENSE "package/${name}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp scripts/install.ps1 "package/${name}/"
            7z a "${name}.zip" "./package/${name}" >/dev/null
          else
            cp scripts/install.sh "package/${name}/"
            chmod 0755 "package/${name}/install.sh"
            tar -czf "${name}.tar.gz" -C package "${name}"
          fi
          ls -l "${name}."*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            yakumo-*.zip
            yakumo-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
