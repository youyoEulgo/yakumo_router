<!DOCTYPE html>
<html lang="">
  <head>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('yakumo-router-theme');
          const theme =
            stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto';
          const dark =
            theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {
          // Ignore storage or matchMedia failures and fall back to the default.
        }
      })();
    </script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/yakumo_alpha.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakumo Router</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
