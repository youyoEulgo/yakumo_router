active_route_table = "default"

[server]
host = "127.0.0.1"
port = 8443

[tls]
cert = "cert.pem"
key = "key.pem"

[openai.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key = "sk-your-openrouter-key"

[[openai.routes]]
id = "openai-gpt"
match = "gpt"
match_type = "contains"
provider = "openrouter"
model = "openai/gpt-4.1"
forward_only = false

[anthropic.providers.deepseek]
base_url = "https://api.deepseek.com/anthropic"
api_key = "sk-your-deepseek-key"

[[anthropic.routes]]
id = "anthropic-sonnet"
match = "sonnet"
match_type = "contains"
provider = "deepseek"
model = "deepseek-v4-pro"
forward_only = false

[[anthropic.routes]]
id = "anthropic-haiku"
match = "haiku"
match_type = "contains"
provider = "deepseek"
model = "deepseek-v4-flash"
forward_only = false

[route_tables.default]
openai = ["openai-gpt"]
anthropic = ["anthropic-sonnet", "anthropic-haiku"]
